name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Node 24 validation
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Require a single pnpm lockfile
        run: |
          test -f pnpm-lock.yaml
          test ! -f package-lock.json
          test ! -f npm-shrinkwrap.json
          test ! -f yarn.lock
          test ! -f bun.lock
          test ! -f bun.lockb
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:format
      - run: git diff --exit-code -- prisma/schema.prisma
      - run: pnpm db:validate
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm baseline:counts
      - run: pnpm build
      - run: pnpm test:client-bundle

  database:
    name: PostgreSQL foundation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: storytelling
          POSTGRES_PASSWORD: ci_only_password
          POSTGRES_DB: storytelling_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U storytelling -d storytelling_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://storytelling:ci_only_password@localhost:5432/storytelling_test
      DIRECT_URL: postgresql://storytelling:ci_only_password@localhost:5432/storytelling_test
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:check-empty
      - run: pnpm db:migrate:deploy
      - run: pnpm db:migrate:deploy
      - run: pnpm db:migrate:status
      - run: pnpm exec prisma migrate diff --from-config-datasource --to-schema prisma/schema.prisma --exit-code
      - run: pnpm test:db
      - run: pnpm test:auth:db
      - run: pnpm test:migration:db
      - run: pnpm test:reads:db
      - run: pnpm test:commands:db
      - run: pnpm test:sync:db
      - run: pnpm build
      - run: pnpm test:auth:http
      - run: pnpm test:commands:http
      - run: pnpm test:sync:http
