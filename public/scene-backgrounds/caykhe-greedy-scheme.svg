<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" height="100%">
  <defs>
    <!-- Afternoon Shady Sky Gradient -->
    <linearGradient id="shadySky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#475569" />
      <stop offset="50%" stop-color="#94a3b8" />
      <stop offset="85%" stop-color="#cbd5e1" />
      <stop offset="100%" stop-color="#e2e8f0" />
    </linearGradient>

    <!-- Starfruit Tree Gradient -->
    <radialGradient id="denseTree" cx="40%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#22c55e" />
      <stop offset="60%" stop-color="#15803d" />
      <stop offset="100%" stop-color="#052e16" />
    </radialGradient>

    <filter id="greedyGlow">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Sky Base -->
  <rect width="1920" height="1080" fill="url(#shadySky)" />

  <!-- Background Yard & Distant Village -->
  <path d="M 0,650 Q 500,580 1000,620 Q 1500,560 1920,640 L 1920,1080 L 0,1080 Z" fill="#64748b" opacity="0.4" />
  <path d="M 0,740 Q 600,680 1200,720 L 1920,730 L 1920,1080 L 0,1080 Z" fill="#334155" />

  <!-- Thatched Cottage Veranda (Hiên Nhà Tranh Nơi Người Anh Nằm Khểnh) -->
  <g transform="translate(180, 580)">
    <!-- Cottage Roof -->
    <polygon points="220,-160 -80,20 520,20" fill="#78350f" stroke="#451a03" stroke-width="3" />
    <rect x="-20" y="20" width="480" height="260" fill="#9a3412" stroke="#431407" stroke-width="3" />
    
    <!-- Bamboo Bed / Porch Mat (Chiếc chõng tre trước hiên) -->
    <rect x="60" y="160" width="280" height="70" fill="#b45309" stroke="#78350f" stroke-width="3" rx="4" />
    <line x1="80" y1="230" x2="80" y2="280" stroke="#78350f" stroke-width="6" />
    <line x1="320" y1="230" x2="320" y2="280" stroke="#78350f" stroke-width="6" />

    <!-- Greedy Older Brother Reclining Lazily (Người anh nằm khểnh ngóng lên cây) -->
    <g transform="translate(160, 150)">
      <circle cx="90" cy="-30" r="20" fill="#ea580c" stroke="#7c2d12" stroke-width="2" />
      <path d="M 70,-10 C 20,-15 -20,-10 -60,10 L -60,40 C -10,35 40,35 70,25 Z" fill="#c2410c" stroke="#7c2d12" stroke-width="2" />
      <!-- Eyes Looking Up Greedily -->
      <circle cx="96" cy="-35" r="4" fill="#000000" />
      <!-- Grinning Mouth -->
      <path d="M 85,-20 Q 95,-12 105,-20" stroke="#000000" stroke-width="2" fill="none" />
    </g>

    <!-- Greedy Wife Sitting Eagerly (Người vợ ngồi chầu chực) -->
    <g transform="translate(380, 120)">
      <circle cx="0" cy="-40" r="18" fill="#ea580c" stroke="#7c2d12" stroke-width="2" />
      <path d="M -20,-20 L 20,-20 L 30,80 L -30,80 Z" fill="#9a3412" stroke="#431407" stroke-width="2" />
    </g>
  </g>

  <!-- Giant 9-Span Bag / Tay Nải Khổng Lồ (Chiếc túi chín gang to gấp 3 lần) -->
  <g transform="translate(560, 820)" filter="url(#greedyGlow)">
    <!-- Giant Cloth Sack (Bao tải chín gang khổng lồ) -->
    <ellipse cx="0" cy="0" rx="90" ry="110" fill="#78350f" stroke="#f59e0b" stroke-width="3" />
    <path d="M -40,-90 Q 0,-140 40,-90" stroke="#d97706" stroke-width="6" fill="none" />
    <!-- Stitched Patch Lines Indicating Enormous 9-Span Size -->
    <line x1="-60" y1="-30" x2="60" y2="-30" stroke="#ca8a04" stroke-width="2" stroke-dasharray="8 4" />
    <line x1="-70" y1="20" x2="70" y2="20" stroke="#ca8a04" stroke-width="2" stroke-dasharray="8 4" />
    <line x1="-50" y1="60" x2="50" y2="60" stroke="#ca8a04" stroke-width="2" stroke-dasharray="8 4" />
    <!-- Golden Label Hint: 9 Gang -->
    <text x="0" y="10" font-family="sans-serif" font-size="22" font-weight="bold" fill="#fde047" text-anchor="middle">TÚI 9 GANG</text>
  </g>

  <!-- Starfruit Tree With Big Shaking Branch (Cây Khế Rung Chuyển Khi Chim Sắp Đến) -->
  <g transform="translate(1420, 500)">
    <path d="M -20,500 C -60,300 -80,100 -20,-60 C 20,-160 120,-80 200,-200 C 240,-80 180,180 120,500 Z" fill="#3e2008" stroke="#1f0f04" stroke-width="4" />
    <ellipse cx="60" cy="-180" rx="380" ry="280" fill="url(#denseTree)" />
    <ellipse cx="280" cy="-100" rx="260" ry="220" fill="url(#denseTree)" opacity="0.95" />
    
    <!-- Golden Ripe Starfruits -->
    <polygon points="40,-40 45,-29 56,-24 45,-19 40,-8 35,-19 24,-24 35,-29" fill="#fde047" stroke="#ca8a04" stroke-width="1.5" transform="scale(2)" />
    <polygon points="140,-120 145,-109 156,-104 145,-99 140,-88 135,-99 124,-104 135,-109" fill="#fde047" stroke="#ca8a04" stroke-width="1.5" transform="scale(1.8)" />
    <polygon points="-80,20 -75,31 -64,36 -75,41 -80,52 -85,41 -96,36 -85,31" fill="#fde047" stroke="#ca8a04" stroke-width="1.5" transform="scale(1.8)" />
  </g>

  <!-- Gust of Wind Ruffling Leaves (Luồng gió mạnh thổi cát bụi) -->
  <g stroke="#ffffff" opacity="0.6" stroke-width="2">
    <path d="M 1200,300 Q 1400,260 1600,310" stroke-dasharray="16 8" />
    <path d="M 1100,420 Q 1350,380 1700,440" stroke-dasharray="20 10" />
    <path d="M 900,550 Q 1250,510 1600,570" stroke-dasharray="14 6" />
  </g>

  <!-- Vignette -->
  <rect width="1920" height="1080" fill="none" stroke="#000000" stroke-width="30" opacity="0.4" />
</svg>
