<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="palaceGlow" cx="50%" cy="40%" r="70%">
      <stop offset="0%" stop-color="#451a03" stop-opacity="1" />
      <stop offset="40%" stop-color="#1c0a00" stop-opacity="1" />
      <stop offset="80%" stop-color="#0a0300" stop-opacity="1" />
      <stop offset="100%" stop-color="#020100" stop-opacity="1" />
    </radialGradient>

    <!-- Golden Dong Son Drum Radial -->
    <radialGradient id="drumGold" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fde047" stop-opacity="0.9" />
      <stop offset="30%" stop-color="#eab308" stop-opacity="0.7" />
      <stop offset="65%" stop-color="#ca8a04" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#854d0e" stop-opacity="0" />
    </radialGradient>

    <!-- Lantern Glow -->
    <radialGradient id="lanternGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fef08a" stop-opacity="1" />
      <stop offset="30%" stop-color="#f59e0b" stop-opacity="0.8" />
      <stop offset="70%" stop-color="#dc2626" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#991b1b" stop-opacity="0" />
    </radialGradient>

    <!-- Glow Filter -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Deep Palace Backdrop -->
  <rect width="1920" height="1080" fill="url(#palaceGlow)" />

  <!-- Giant Glowing Dong Son Bronze Drum Sun Mandala in Center Background -->
  <g transform="translate(960, 480)" opacity="0.45">
    <!-- Outer Rings -->
    <circle r="460" fill="none" stroke="#eab308" stroke-width="2" stroke-dasharray="8 6" />
    <circle r="420" fill="none" stroke="#ca8a04" stroke-width="3" />
    <circle r="380" fill="none" stroke="#eab308" stroke-width="1.5" stroke-dasharray="16 8" />
    <circle r="320" fill="none" stroke="#ca8a04" stroke-width="2" />
    <circle r="260" fill="none" stroke="#eab308" stroke-width="1" />
    <circle r="180" fill="url(#drumGold)" />
    <!-- 14-Pointed Dong Son Sun Star -->
    <path d="M 0,-180 L 22,-60 L 127,-127 L 60,-22 L 180,0 L 60,22 L 127,127 L 22,60 L 0,180 L -22,60 L -127,127 L -60,22 L -180,0 L -60,-22 L -127,-127 L -22,-60 Z" fill="#fde047" opacity="0.85" filter="url(#softGlow)" />
    <circle r="40" fill="#fef08a" />
  </g>

  <!-- Royal Palace Pillars (Left & Right) -->
  <g fill="#1a0c02" stroke="#78350f" stroke-width="3">
    <!-- Left Pillars -->
    <rect x="120" y="0" width="90" height="1080" />
    <rect x="100" y="200" width="130" height="30" rx="6" fill="#78350f" />
    <rect x="100" y="850" width="130" height="40" rx="6" fill="#78350f" />
    <rect x="290" y="0" width="70" height="1080" opacity="0.8" />

    <!-- Right Pillars -->
    <rect x="1710" y="0" width="90" height="1080" />
    <rect x="1690" y="200" width="130" height="30" rx="6" fill="#78350f" />
    <rect x="1690" y="850" width="130" height="40" rx="6" fill="#78350f" />
    <rect x="1560" y="0" width="70" height="1080" opacity="0.8" />
  </g>

  <!-- Hanging Royal Lanterns with Warm Amber Glow -->
  <g filter="url(#softGlow)">
    <!-- Left Lanterns -->
    <circle cx="250" cy="280" r="140" fill="url(#lanternGlow)" />
    <line x1="250" y1="0" x2="250" y2="250" stroke="#ca8a04" stroke-width="2" />
    <rect x="235" y="250" width="30" height="50" rx="8" fill="#eab308" />
    
    <!-- Right Lanterns -->
    <circle cx="1670" cy="280" r="140" fill="url(#lanternGlow)" />
    <line x1="1670" y1="0" x2="1670" y2="250" stroke="#ca8a04" stroke-width="2" />
    <rect x="1655" y="250" width="30" height="50" rx="8" fill="#eab308" />
  </g>

  <!-- Palace Floor & Dais (Bệ ngai vàng) -->
  <path d="M 0,880 L 550,780 L 1370,780 L 1920,880 L 1920,1080 L 0,1080 Z" fill="#140801" stroke="#451a03" stroke-width="2" />
  <path d="M 600,780 L 700,710 L 1220,710 L 1320,780 Z" fill="#240f03" stroke="#78350f" stroke-width="2" />

  <!-- Throne Silhouette (Ngai vàng chạm trổ chim Lạc) -->
  <g transform="translate(960, 640)" fill="#b45309" stroke="#f59e0b" stroke-width="2" filter="url(#softGlow)">
    <!-- Throne Backrest with Lac Bird Wings -->
    <path d="M -90,-80 C -150,-120 -180,-70 -160,-10 C -140,30 -90,40 -60,50 L 60,50 C 90,40 140,30 160,-10 C 180,-70 150,-120 90,-80 C 60,-100 20,-110 0,-110 C -20,-110 -60,-100 -90,-80 Z" />
    <!-- Throne Seat -->
    <rect x="-80" y="30" width="160" height="40" rx="6" fill="#78350f" />
    <!-- Golden Cushions -->
    <rect x="-65" y="15" width="130" height="20" rx="4" fill="#eab308" />
  </g>

  <!-- Floating Golden Dust & Sparkles -->
  <g fill="#fde047" opacity="0.75" filter="url(#softGlow)">
    <circle cx="500" cy="400" r="3" />
    <circle cx="720" cy="310" r="4" />
    <circle cx="850" cy="550" r="2.5" />
    <circle cx="1100" cy="380" r="3.5" />
    <circle cx="1380" cy="460" r="4" />
    <circle cx="1500" cy="320" r="2" />
    <circle cx="960" cy="220" r="5" />
  </g>

  <!-- Dark Cinematic Vignette Border -->
  <rect width="1920" height="1080" fill="none" stroke="#000000" stroke-width="40" opacity="0.6" />
</svg>
