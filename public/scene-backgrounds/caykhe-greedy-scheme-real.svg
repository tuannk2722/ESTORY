<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" height="100%">
  <defs>
    <!-- Afternoon Shady Sky -->
    <linearGradient id="realShadySky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="45%" stop-color="#64748b" />
      <stop offset="85%" stop-color="#94a3b8" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>

    <!-- Starfruit Tree Canopy -->
    <radialGradient id="realGreedyTree" cx="40%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#22c55e" />
      <stop offset="60%" stop-color="#15803d" />
      <stop offset="100%" stop-color="#052e16" />
    </radialGradient>

    <filter id="realGreedyGlow">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Sky Base -->
  <rect width="1920" height="1080" fill="url(#realShadySky)" />

  <!-- Background Yard & Distant Village in Mist -->
  <path d="M 0,650 Q 500,580 1000,620 Q 1500,560 1920,640 L 1920,1080 L 0,1080 Z" fill="#475569" opacity="0.5" />
  <path d="M 0,740 Q 600,680 1200,720 L 1920,730 L 1920,1080 L 0,1080 Z" fill="#1e293b" />

  <!-- Thatched Cottage Veranda (Hiên Nhà Nơi Người Anh Nằm Khểnh) -->
  <g transform="translate(180, 580)">
    <polygon points="220,-160 -80,20 520,20" fill="#78350f" stroke="#451a03" stroke-width="4" />
    <rect x="-20" y="20" width="480" height="260" fill="#9a3412" stroke="#431407" stroke-width="4" />
    
    <!-- Bamboo Bench with Living Sway Motion -->
    <rect x="60" y="160" width="280" height="70" fill="#b45309" stroke="#78350f" stroke-width="3" rx="4" />
    <line x1="80" y1="230" x2="80" y2="280" stroke="#78350f" stroke-width="6" />
    <line x1="320" y1="230" x2="320" y2="280" stroke="#78350f" stroke-width="6" />

    <!-- Greedy Older Brother Reclining Lazily in Living Breathing Motion (Người Anh Nằm Khểnh Hí Hửng) -->
    <g transform="translate(160, 150)" style="animation: human-breathe 4.5s ease-in-out infinite;">
      <circle cx="90" cy="-30" r="22" fill="#ea580c" stroke="#7c2d12" stroke-width="2" />
      <path d="M 70,-10 C 20,-15 -20,-10 -60,10 L -60,40 C -10,35 40,35 70,25 Z" fill="#c2410c" stroke="#7c2d12" stroke-width="2.5" />
      <!-- Scheming Grin -->
      <circle cx="98" cy="-34" r="4.5" fill="#000000" />
      <path d="M 85,-18 Q 97,-8 107,-18" stroke="#000000" stroke-width="2.5" fill="none" />
    </g>

    <!-- Greedy Wife Sitting Beside -->
    <g transform="translate(380, 120)" style="animation: human-breathe 4s 0.5s ease-in-out infinite;">
      <circle cx="0" cy="-40" r="19" fill="#ea580c" stroke="#7c2d12" stroke-width="2" />
      <path d="M -20,-20 L 20,-20 L 30,80 L -30,80 Z" fill="#9a3412" stroke="#431407" stroke-width="2.5" />
    </g>
  </g>

  <!-- Enormous 9-Span Burlap Sack (Chiếc Túi Chín Gang Khổng Lồ May Bằng Vải Bố) -->
  <g transform="translate(560, 810)" filter="url(#realGreedyGlow)">
    <ellipse cx="0" cy="0" rx="95" ry="115" fill="#78350f" stroke="#f59e0b" stroke-width="4" />
    <path d="M -45,-95 Q 0,-150 45,-95" stroke="#d97706" stroke-width="7" fill="none" />
    <!-- Burlap Stitch Lines -->
    <line x1="-65" y1="-30" x2="65" y2="-30" stroke="#ca8a04" stroke-width="2.5" stroke-dasharray="8 4" />
    <line x1="-75" y1="20" x2="75" y2="20" stroke="#ca8a04" stroke-width="2.5" stroke-dasharray="8 4" />
    <line x1="-55" y1="65" x2="55" y2="65" stroke="#ca8a04" stroke-width="2.5" stroke-dasharray="8 4" />
    <text x="0" y="12" font-family="sans-serif" font-size="24" font-weight="bold" fill="#fde047" text-anchor="middle">TÚI 9 GANG</text>
  </g>

  <!-- Starfruit Tree in Living Wind Sway Motion (Cây Khế Rung Chuyển Đón Gió) -->
  <g transform="translate(1420, 500)" style="animation: tree-sway 5s ease-in-out infinite alternate;">
    <path d="M -20,500 C -60,300 -80,100 -20,-60 C 20,-160 120,-80 200,-200 C 240,-80 180,180 120,500 Z" fill="#3e2008" stroke="#1f0f04" stroke-width="4" />
    <ellipse cx="60" cy="-180" rx="400" ry="290" fill="url(#realGreedyTree)" />
    <ellipse cx="280" cy="-100" rx="280" ry="230" fill="url(#realGreedyTree)" opacity="0.95" />
    
    <!-- Golden Ripe Starfruits -->
    <polygon points="40,-40 45,-29 56,-24 45,-19 40,-8 35,-19 24,-24 35,-29" fill="#fde047" stroke="#ca8a04" stroke-width="1.5" transform="scale(2.2)" />
    <polygon points="140,-120 145,-109 156,-104 145,-99 140,-88 135,-99 124,-104 135,-109" fill="#fde047" stroke="#ca8a04" stroke-width="1.5" transform="scale(2)" />
  </g>

  <!-- Gust of Wind Streaks -->
  <g stroke="#ffffff" opacity="0.65" stroke-width="2.5">
    <path d="M 1150,300 Q 1380,250 1650,310" stroke-dasharray="18 8" />
    <path d="M 1050,430 Q 1320,380 1720,440" stroke-dasharray="22 10" />
  </g>

  <!-- Vignette -->
  <rect width="1920" height="1080" fill="none" stroke="#000000" stroke-width="30" opacity="0.4" />
</svg>
