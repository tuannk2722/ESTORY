<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" height="100%">
  <defs>
    <!-- Cinematic Dark Palace Lighting -->
    <radialGradient id="cinemaPalaceDark" cx="50%" cy="40%" r="75%">
      <stop offset="0%" stop-color="#3d1802" />
      <stop offset="35%" stop-color="#190901" />
      <stop offset="70%" stop-color="#090300" />
      <stop offset="100%" stop-color="#020100" />
    </radialGradient>

    <!-- Warm Torchlight Glow -->
    <radialGradient id="cinemaTorchFlame" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="1" />
      <stop offset="25%" stop-color="#fde047" stop-opacity="0.95" />
      <stop offset="55%" stop-color="#f97316" stop-opacity="0.75" />
      <stop offset="85%" stop-color="#dc2626" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#7f1d1d" stop-opacity="0" />
    </radialGradient>

    <!-- Golden Dong Son Drum Metal -->
    <radialGradient id="cinemaBronzeMetal" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="25%" stop-color="#eab308" />
      <stop offset="55%" stop-color="#ca8a04" />
      <stop offset="80%" stop-color="#854d0e" />
      <stop offset="100%" stop-color="#451a03" />
    </radialGradient>

    <filter id="cinemaPalaceGlow">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Deep Palace Backdrop -->
  <rect width="1920" height="1080" fill="url(#cinemaPalaceDark)" />

  <!-- Dong Son Sun Mandala Disk with Ambient Golden Shimmer -->
  <g transform="translate(960, 420)" opacity="0.6" filter="url(#cinemaPalaceGlow)">
    <circle r="460" fill="none" stroke="#eab308" stroke-width="2" stroke-dasharray="10 8" />
    <circle r="400" fill="none" stroke="#ca8a04" stroke-width="3" />
    <circle r="330" fill="none" stroke="#eab308" stroke-width="1.5" stroke-dasharray="18 10" />
    <circle r="250" fill="url(#cinemaBronzeMetal)" opacity="0.85" />
    <path d="M 0,-250 L 30,-85 L 180,-180 L 85,-30 L 250,0 L 85,30 L 180,180 L 30,85 L 0,250 L -30,85 L -180,180 L -85,30 L -250,0 L -85,-30 L -180,-180 L -30,-85 Z" fill="#fef08a" opacity="0.9" />
    <circle r="55" fill="#ffffff" opacity="0.8" />
  </g>

  <!-- Massive Carved Ironwood Columns (Cột Gỗ Lim Hoàng Cung) -->
  <g fill="#1a0c02" stroke="#78350f" stroke-width="4">
    <rect x="80" y="0" width="120" height="1080" />
    <rect x="260" y="0" width="85" height="1080" opacity="0.75" />
    <rect x="1720" y="0" width="120" height="1080" />
    <rect x="1575" y="0" width="85" height="1080" opacity="0.75" />
  </g>

  <!-- Living Flickering Torches (Đuốc Sáng Hoàng Cung) -->
  <g filter="url(#cinemaPalaceGlow)">
    <g transform="translate(200, 380)">
      <circle cx="0" cy="0" r="170" fill="url(#cinemaTorchFlame)" style="animation: lantern-flicker 2.5s infinite alternate;" />
      <polygon points="0,-45 -15,10 15,10" fill="#fef08a" />
      <rect x="-10" y="10" width="20" height="60" fill="#78350f" stroke="#ca8a04" stroke-width="2" />
    </g>
    <g transform="translate(1720, 380)">
      <circle cx="0" cy="0" r="170" fill="url(#cinemaTorchFlame)" style="animation: lantern-flicker 2.8s 0.6s infinite alternate;" />
      <polygon points="0,-45 -15,10 15,10" fill="#fef08a" />
      <rect x="-10" y="10" width="20" height="60" fill="#78350f" stroke="#ca8a04" stroke-width="2" />
    </g>
  </g>

  <!-- Throne Dais (Bệ Ngai Vàng Văn Lang) -->
  <path d="M 0,860 L 520,740 L 1400,740 L 1920,860 L 1920,1080 L 0,1080 Z" fill="#120601" stroke="#451a03" stroke-width="3" />
  <path d="M 580,740 L 680,670 L 1240,670 L 1340,740 Z" fill="#290f02" stroke="#78350f" stroke-width="3" />

  <!-- Photorealistic King Hung the 18th in Living Breathing Motion -->
  <g transform="translate(860, 590)" style="animation: human-breathe 4.5s ease-in-out infinite;">
    <!-- Van Lang Royal Feather Headdress -->
    <path d="M -32,-120 L -48,-195 L -26,-160 L 0,-215 L 26,-160 L 48,-195 L 32,-120 Z" fill="#fde047" stroke="#b45309" stroke-width="2" filter="url(#cinemaPalaceGlow)" />
    <ellipse cx="0" cy="-80" rx="32" ry="38" fill="#d97706" stroke="#78350f" stroke-width="2" />
    <!-- Brocade Robe with Dong Son Motifs -->
    <path d="M -75,-30 L -95,140 L 95,140 L 75,-30 Z" fill="#b91c1c" stroke="#fde047" stroke-width="3" />
    <circle cx="0" cy="10" r="24" fill="#fde047" stroke="#b45309" stroke-width="2" filter="url(#cinemaPalaceGlow)" />
  </g>

  <!-- Photorealistic Princess My Nuong with Delicate Silk Drape -->
  <g transform="translate(1080, 610)" style="animation: human-breathe 4s 0.5s ease-in-out infinite;">
    <ellipse cx="0" cy="-70" rx="24" ry="28" fill="#fbbf24" stroke="#b45309" stroke-width="1.5" />
    <path d="M -26,-85 C -22,-118 22,-118 26,-85" fill="#1c1917" />
    <line x1="-32" y1="-95" x2="32" y2="-95" stroke="#fde047" stroke-width="3" filter="url(#cinemaPalaceGlow)" />
    <!-- Flowing Golden & Emerald Silk Robe -->
    <path d="M -48,-40 L -65,130 L 65,130 L 48,-40 Z" fill="#fef08a" stroke="#ca8a04" stroke-width="2" />
    <path d="M -28,-20 L -38,130 L 38,130 L 28,-20 Z" fill="#34d399" opacity="0.85" />
  </g>

  <!-- Golden Incense Smoke & Floating Motes in Air -->
  <g fill="#fde047" opacity="0.85" filter="url(#cinemaPalaceGlow)">
    <circle cx="580" cy="380" r="4" style="animation: gem-twinkle 3s infinite alternate;" />
    <circle cx="780" cy="290" r="5" style="animation: gem-twinkle 3.5s 0.8s infinite alternate;" />
    <circle cx="1180" cy="350" r="4.5" style="animation: gem-twinkle 2.8s 0.4s infinite alternate;" />
  </g>

  <!-- Cinematic Vignette -->
  <rect width="1920" height="1080" fill="none" stroke="#000000" stroke-width="35" opacity="0.55" />
</svg>
