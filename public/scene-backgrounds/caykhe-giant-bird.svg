<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" height="100%">
  <defs>
    <!-- Morning Twilight Sky Gradient -->
    <linearGradient id="twilightSky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="45%" stop-color="#38bdf8" />
      <stop offset="80%" stop-color="#fde047" />
      <stop offset="100%" stop-color="#fef08a" />
    </linearGradient>

    <!-- Giant Bird Feathers Gradient (Lông Ngũ Sắc Thần Kỳ) -->
    <linearGradient id="birdFeather" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="30%" stop-color="#3b82f6" />
      <stop offset="60%" stop-color="#8b5cf6" />
      <stop offset="85%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#ef4444" />
    </linearGradient>

    <!-- Divine Golden Aura -->
    <radialGradient id="birdAura" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fde047" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#f59e0b" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#ca8a04" stop-opacity="0" />
    </radialGradient>

    <filter id="divineGlow">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Sky Base -->
  <rect width="1920" height="1080" fill="url(#twilightSky)" />

  <!-- Mountain Hills in Background -->
  <path d="M 0,620 Q 400,500 850,580 Q 1300,510 1920,600 L 1920,1080 L 0,1080 Z" fill="#4ade80" opacity="0.75" />
  <path d="M 0,720 Q 500,660 1000,710 L 1920,720 L 1920,1080 L 0,1080 Z" fill="#16a34a" />

  <!-- Starfruit Tree Trunk & Spreading Branches -->
  <g transform="translate(680, 520)">
    <path d="M 0,480 C -50,300 -80,100 -20,-60 C 20,-160 120,-80 200,-200 C 240,-80 180,180 120,480 Z" fill="#3e2008" stroke="#1f0f04" stroke-width="4" />
    <!-- Branch Supporting Giant Bird -->
    <path d="M 50,-120 C 180,-140 380,-100 550,-140 C 650,-160 780,-120 900,-80" stroke="#3e2008" stroke-width="36" fill="none" stroke-linecap="round" />
    
    <!-- Leaves & Starfruit Clusters -->
    <ellipse cx="-40" cy="-240" rx="300" ry="220" fill="#15803d" opacity="0.9" />
    <ellipse cx="280" cy="-280" rx="320" ry="240" fill="#22c55e" opacity="0.9" />
    <ellipse cx="650" cy="-260" rx="300" ry="200" fill="#16a34a" opacity="0.85" />
    
    <!-- Hanging Fruits -->
    <g filter="url(#divineGlow)">
      <polygon points="120,-60 125,-49 136,-44 125,-39 120,-28 115,-39 104,-44 115,-49" fill="#fde047" stroke="#ca8a04" stroke-width="1.5" transform="scale(2)" />
      <polygon points="180,-70 185,-59 196,-54 185,-49 180,-38 175,-49 164,-54 175,-59" fill="#fde047" stroke="#ca8a04" stroke-width="1.5" transform="scale(2.2)" />
    </g>
  </g>

  <!-- Giant Divine Phoenix Bird (Chim Thần Khổng Lồ Đang Ăn Khế & Mở Lời) -->
  <g transform="translate(1320, 360)" filter="url(#divineGlow)">
    <!-- Divine Aura Behind Bird -->
    <circle cx="0" cy="0" r="260" fill="url(#birdAura)" />

    <!-- Bird Large Body -->
    <ellipse cx="0" cy="40" rx="160" ry="110" fill="url(#birdFeather)" stroke="#fde047" stroke-width="3" />
    
    <!-- Majestic Layered Wings (Đôi cánh thần ngũ sắc) -->
    <path d="M -80,0 C -180,-140 -260,-160 -360,-110 C -340,-20 -240,40 -120,60 Z" fill="url(#birdFeather)" stroke="#fde047" stroke-width="3" />
    <path d="M 60,0 C 140,-120 220,-150 320,-100 C 300,-10 210,50 100,70 Z" fill="url(#birdFeather)" stroke="#fde047" stroke-width="3" />
    
    <!-- Graceful Long Tail Feathers (Đuôi phượng hoàng uốn lượn) -->
    <path d="M 120,90 Q 240,160 300,320 Q 280,330 200,240 Q 140,160 80,110 Z" fill="#ef4444" stroke="#fde047" stroke-width="2" />
    <path d="M 90,100 Q 180,220 220,380 Q 200,390 140,280 Q 100,180 50,110 Z" fill="#f59e0b" stroke="#fde047" stroke-width="2" />

    <!-- Curved Noble Neck & Head (Cổ vươn cao, mắt hiền từ như cười) -->
    <path d="M -90,-20 C -140,-80 -180,-160 -150,-240 C -130,-280 -80,-280 -60,-240 C -50,-180 -50,-90 -40,-20 Z" fill="url(#birdFeather)" stroke="#fde047" stroke-width="3" />
    <circle cx="-110" cy="-240" r="45" fill="#3b82f6" stroke="#fde047" stroke-width="2.5" />
    
    <!-- Golden Crown Crest (Mào chim thần) -->
    <path d="M -110,-280 L -140,-340 L -115,-300 L -100,-350 L -90,-300 L -60,-330 L -80,-275 Z" fill="#fde047" stroke="#eab308" stroke-width="2" />

    <!-- Golden Eye (Mắt nheo cười thân thiện) -->
    <ellipse cx="-125" cy="-245" rx="8" ry="4" fill="#000000" stroke="#fde047" stroke-width="2" />
    
    <!-- Strong Curved Golden Beak Holding A Ripe Starfruit (Mỏ vàng ngậm khế) -->
    <path d="M -150,-245 L -230,-225 L -160,-215 Z" fill="#f59e0b" stroke="#b45309" stroke-width="2" />
    <!-- Glowing Starfruit in Beak -->
    <polygon points="-230,-225 -225,-214 -214,-209 -225,-204 -230,-193 -235,-204 -246,-209 -235,-214" fill="#fef08a" stroke="#ca8a04" stroke-width="1.5" transform="scale(1.8)" />
  </g>

  <!-- Humble Farmer & Wife Looking Up In Awe (Vợ chồng người em đứng dưới gốc cây) -->
  <g transform="translate(420, 780)" fill="#451a03" stroke="#291003" stroke-width="2">
    <!-- Husband (Người Chồng) -->
    <ellipse cx="0" cy="-90" rx="16" ry="18" fill="#d97706" />
    <path d="M -20,-65 C -35,-30 -30,40 -20,90 L 20,90 C 30,40 35,-30 20,-65 Z" fill="#78350f" />
    <!-- Carrying Pole & Baskets (Quang gánh) -->
    <line x1="-80" y1="20" x2="80" y2="20" stroke="#d97706" stroke-width="4" />
    <ellipse cx="-80" cy="60" rx="25" ry="15" fill="#b45309" />
    <ellipse cx="80" cy="60" rx="25" ry="15" fill="#b45309" />

    <!-- Wife (Người Vợ Áo Nâu Nhìn Lên) -->
    <g transform="translate(100, 10)">
      <ellipse cx="0" cy="-90" rx="14" ry="16" fill="#d97706" />
      <path d="M -18,-65 C -30,-20 -25,40 -15,80 L 15,80 C 25,40 30,-20 18,-65 Z" fill="#92400e" />
      <!-- Hands Clasped In Wonder -->
      <circle cx="-10" cy="-20" r="8" fill="#d97706" />
    </g>
  </g>

  <!-- Divine Magical Speech Dust (Ăn một quả, trả cục vàng!) -->
  <g fill="#fde047" opacity="0.85" filter="url(#divineGlow)">
    <circle cx="1080" cy="220" r="7" />
    <circle cx="950" cy="280" r="5" />
    <circle cx="820" cy="340" r="6" />
    <circle cx="700" cy="420" r="4.5" />
  </g>

  <!-- Vignette -->
  <rect width="1920" height="1080" fill="none" stroke="#000000" stroke-width="30" opacity="0.4" />
</svg>
