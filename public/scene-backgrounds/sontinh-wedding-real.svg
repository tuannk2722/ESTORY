<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" height="100%">
  <defs>
    <!-- Glorious Sunset Glow Over Mountain Pass -->
    <radialGradient id="realSunsetSky" cx="50%" cy="40%" r="80%">
      <stop offset="0%" stop-color="#991b1b" />
      <stop offset="35%" stop-color="#450a0a" />
      <stop offset="70%" stop-color="#180404" />
      <stop offset="100%" stop-color="#050101" />
    </radialGradient>

    <!-- Golden Sun Aura Behind Ba Vi Ridge -->
    <radialGradient id="goldenMountainRim" cx="50%" cy="55%" r="45%">
      <stop offset="0%" stop-color="#fde047" stop-opacity="0.75" />
      <stop offset="40%" stop-color="#f97316" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#dc2626" stop-opacity="0" />
    </radialGradient>

    <filter id="festiveRealGlow">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Sky Base -->
  <rect width="1920" height="1080" fill="url(#realSunsetSky)" />
  <rect width="1920" height="1080" fill="url(#goldenMountainRim)" />

  <!-- Mountain Slopes of Ba Vi (Đèo Núi Ba Vì Rợp Cờ Hoa) -->
  <path d="M 0,660 L 320,490 L 680,580 L 960,390 L 1320,530 L 1680,460 L 1920,590 L 1920,1080 L 0,1080 Z" fill="#2d0a0a" stroke="#7f1d1d" stroke-width="2" />
  <path d="M 0,780 Q 480,640 1000,700 Q 1500,660 1920,760 L 1920,1080 L 0,1080 Z" fill="#180404" />

  <!-- Realistic Nine-Tusked Elephant (Voi Chín Ngà Vạm Vỡ Mang Kiệu Hoa) -->
  <g transform="translate(680, 690)" style="animation: human-breathe 5s ease-in-out infinite;" filter="url(#festiveRealGlow)">
    <!-- Elephant Massive Muscle Body & Wrinkles -->
    <path d="M -90,50 C -120,-30 -80,-100 20,-100 C 90,-100 130,-50 120,30 C 120,60 100,100 90,120 L 50,120 L 55,50 L -20,50 L -30,120 L -70,120 Z" fill="#573010" stroke="#331904" stroke-width="3" />
    <path d="M -90,-20 C -140,-40 -160,20 -170,80 C -160,85 -150,70 -150,50 C -140,-10 -100,10 -80,10 Z" fill="#573010" stroke="#331904" stroke-width="3" />
    
    <!-- 9 Radiant Sharp Curved Golden Tusks (Chín Ngà Vàng Sáng Chói) -->
    <g stroke="#fef08a" stroke-width="4" fill="none" opacity="0.95">
      <path d="M -120,10 C -150,0 -190,-5 -220,10" stroke-width="5" />
      <path d="M -115,18 C -145,10 -185,5 -215,20" stroke-width="4.5" />
      <path d="M -110,26 C -140,20 -180,15 -210,30" stroke-width="4.5" />
      <path d="M -105,34 C -135,28 -175,25 -205,40" stroke-width="4" />
      <path d="M -100,42 C -130,36 -170,35 -200,50" stroke-width="4" />
    </g>

    <!-- Ornate Royal Howdah Carriage with Princess My Nuong Inside (Kiệu Hoa Rực Rỡ) -->
    <g transform="translate(20, -140)">
      <rect x="-60" y="0" width="120" height="70" rx="8" fill="#dc2626" stroke="#fde047" stroke-width="3" />
      <polygon points="0,-40 -70,0 70,0" fill="#f59e0b" stroke="#b45309" stroke-width="2" />
      <!-- Gold Curtains -->
      <path d="M -40,10 L -40,60" stroke="#fef08a" stroke-width="3" />
      <path d="M 40,10 L 40,60" stroke="#fef08a" stroke-width="3" />
    </g>
  </g>

  <!-- Realistic Nine-Maned Red Warhorse (Ngựa Chín Hồng Mao Phi Nước Kiệu) -->
  <g transform="translate(1220, 720)" style="animation: human-breathe 4.2s 0.4s ease-in-out infinite;" filter="url(#festiveRealGlow)">
    <!-- Powerful Muscular Horse Body -->
    <path d="M -60,20 C -80,-30 -50,-80 20,-80 C 70,-80 90,-40 80,40 L 50,100 L 30,100 L 45,40 L -10,40 L -25,100 L -50,100 Z" fill="#991b1b" stroke="#450a0a" stroke-width="3" />
    <path d="M 50,-50 C 80,-90 100,-100 125,-75 C 110,-50 90,-30 65,-30 Z" fill="#991b1b" stroke="#450a0a" stroke-width="3" />
    
    <!-- 9 Flaming Red Manes Waving in Wind (Chín Hồng Mao Đỏ Thắm Rực Lửa) -->
    <g stroke="#f87171" stroke-width="4" fill="none" opacity="0.9">
      <path d="M 80,-80 C 60,-110 50,-95 55,-75" />
      <path d="M 70,-70 C 50,-100 40,-85 45,-65" />
      <path d="M 60,-60 C 40,-90 30,-75 35,-55" />
      <path d="M 50,-50 C 30,-80 20,-65 25,-45" />
      <path d="M 40,-40 C 20,-70 10,-55 15,-35" />
    </g>
  </g>

  <!-- Red Festive Banners & Silk Streamers Waving in Wind -->
  <g stroke="#ef4444" stroke-width="4" fill="none" opacity="0.85">
    <path d="M 380,500 Q 420,440 480,470 Q 520,500 560,450" />
    <path d="M 1520,520 Q 1580,460 1640,490 Q 1700,520 1760,470" />
  </g>

  <!-- Vignette -->
  <rect width="1920" height="1080" fill="none" stroke="#000000" stroke-width="35" opacity="0.5" />
</svg>
