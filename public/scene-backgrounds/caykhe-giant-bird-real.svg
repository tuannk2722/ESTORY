<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" height="100%">
  <defs>
    <!-- Early Morning Sky -->
    <linearGradient id="realEarlySky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="40%" stop-color="#38bdf8" />
      <stop offset="75%" stop-color="#fde047" />
      <stop offset="100%" stop-color="#fef08a" />
    </linearGradient>

    <!-- Iridescent Phoenix Feather Gradient (Lông Vũ Ngũ Sắc Ánh Kim) -->
    <linearGradient id="realBirdFeather" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="25%" stop-color="#3b82f6" />
      <stop offset="55%" stop-color="#8b5cf6" />
      <stop offset="80%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#ef4444" />
    </linearGradient>

    <radialGradient id="realBirdAura" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fde047" stop-opacity="0.85" />
      <stop offset="50%" stop-color="#f59e0b" stop-opacity="0.45" />
      <stop offset="100%" stop-color="#ca8a04" stop-opacity="0" />
    </radialGradient>

    <filter id="realBirdGlow">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Sky Base -->
  <rect width="1920" height="1080" fill="url(#realEarlySky)" />

  <!-- Mountain Hills in Background -->
  <path d="M 0,630 Q 420,510 880,590 Q 1340,520 1920,610 L 1920,1080 L 0,1080 Z" fill="#4ade80" opacity="0.75" />
  <path d="M 0,730 Q 520,670 1020,720 L 1920,730 L 1920,1080 L 0,1080 Z" fill="#16a34a" />

  <!-- Starfruit Tree Trunk & Large Perch Branch -->
  <g transform="translate(680, 520)">
    <path d="M 0,480 C -50,300 -80,100 -20,-60 C 20,-160 120,-80 200,-200 C 240,-80 180,180 120,480 Z" fill="#3e2008" stroke="#1f0f04" stroke-width="4" />
    <path d="M 50,-120 C 180,-140 380,-100 550,-140 C 650,-160 780,-120 900,-80" stroke="#3e2008" stroke-width="38" fill="none" stroke-linecap="round" />
    <ellipse cx="280" cy="-280" rx="340" ry="250" fill="#22c55e" opacity="0.9" />
  </g>

  <!-- Living Divine Giant Bird with Breathing & Glide Motion (Chim Thần Sống Động Đang Mở Lời) -->
  <g transform="translate(1320, 360)" filter="url(#realBirdGlow)" style="animation: bird-glide 5s ease-in-out infinite alternate;">
    <!-- Divine Golden Aura -->
    <circle cx="0" cy="0" r="280" fill="url(#realBirdAura)" />

    <!-- Iridescent Feathered Body -->
    <ellipse cx="0" cy="40" rx="170" ry="120" fill="url(#realBirdFeather)" stroke="#fde047" stroke-width="3.5" />
    
    <!-- Majestic Layered Wings in Living Flap Motion -->
    <path d="M -90,0 C -190,-150 -280,-170 -380,-120 C -360,-20 -250,50 -130,70 Z" fill="url(#realBirdFeather)" stroke="#fde047" stroke-width="3.5" />
    <path d="M 70,0 C 150,-130 240,-160 340,-110 C 320,-10 220,60 110,80 Z" fill="url(#realBirdFeather)" stroke="#fde047" stroke-width="3.5" />
    
    <!-- Graceful Long Phoenix Tail Feathers (Đuôi Phượng Hoàng Uốn Lượn) -->
    <path d="M 130,90 Q 250,170 320,340 Q 300,350 210,250 Q 150,170 90,120 Z" fill="#ef4444" stroke="#fde047" stroke-width="2.5" />
    <path d="M 100,100 Q 190,230 240,400 Q 220,410 150,290 Q 110,190 60,120 Z" fill="#f59e0b" stroke="#fde047" stroke-width="2.5" />

    <!-- Curved Neck & Regal Crown Crest -->
    <path d="M -100,-20 C -150,-80 -190,-160 -160,-240 C -140,-280 -90,-280 -70,-240 C -60,-180 -60,-90 -50,-20 Z" fill="url(#realBirdFeather)" stroke="#fde047" stroke-width="3.5" />
    <circle cx="-120" cy="-240" r="48" fill="#3b82f6" stroke="#fde047" stroke-width="3" />
    <!-- Crown Crest Feathers -->
    <path d="M -120,-285 L -150,-350 L -125,-310 L -110,-360 L -100,-310 L -70,-340 L -90,-280 Z" fill="#fde047" stroke="#eab308" stroke-width="2.5" />

    <!-- Living Smiling Golden Eye -->
    <ellipse cx="-135" cy="-245" rx="9" ry="4.5" fill="#000000" stroke="#fde047" stroke-width="2" />
    
    <!-- Strong Curved Golden Beak Holding Ripe Starfruit -->
    <path d="M -160,-245 L -245,-225 L -170,-215 Z" fill="#f59e0b" stroke="#b45309" stroke-width="2.5" />
    <polygon points="-245,-225 -240,-214 -229,-209 -240,-204 -245,-193 -250,-204 -261,-209 -250,-214" fill="#fef08a" stroke="#ca8a04" stroke-width="1.5" transform="scale(2)" />
  </g>

  <!-- Humble Peasant Couple in Living Breathing Motion (Vợ Chồng Người Em Ngước Nhìn Thán Phục) -->
  <g transform="translate(420, 780)" style="animation: human-breathe 4s ease-in-out infinite;">
    <!-- Husband -->
    <ellipse cx="0" cy="-90" rx="18" ry="20" fill="#d97706" />
    <path d="M -22,-65 C -38,-30 -32,40 -22,90 L 22,90 C 32,40 38,-30 22,-65 Z" fill="#78350f" stroke="#451a03" stroke-width="2" />
    <!-- Wife Standing Beside -->
    <g transform="translate(105, 10)">
      <ellipse cx="0" cy="-90" rx="15" ry="17" fill="#d97706" />
      <path d="M -20,-65 C -32,-20 -27,40 -16,80 L 16,80 C 27,40 32,-20 20,-65 Z" fill="#92400e" stroke="#451a03" stroke-width="2" />
    </g>
  </g>

  <!-- Vignette -->
  <rect width="1920" height="1080" fill="none" stroke="#000000" stroke-width="30" opacity="0.4" />
</svg>
