<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" height="100%">
  <defs>
    <!-- Wild Storm Tempest Sky -->
    <radialGradient id="realAbyssSky" cx="50%" cy="30%" r="85%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="40%" stop-color="#0f172a" />
      <stop offset="75%" stop-color="#030712" />
      <stop offset="100%" stop-color="#000000" />
    </radialGradient>

    <!-- Raging Ocean Waves -->
    <linearGradient id="realAbyssWater" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0369a1" />
      <stop offset="35%" stop-color="#082f49" />
      <stop offset="75%" stop-color="#020617" />
      <stop offset="100%" stop-color="#000000" />
    </linearGradient>

    <filter id="realStormGlow">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Sky Base -->
  <rect width="1920" height="1080" fill="url(#realAbyssSky)" />

  <!-- Thunderstorm Lightning Strike in Clouds -->
  <g filter="url(#realStormGlow)" stroke="#f0f9ff" stroke-width="4.5" fill="none">
    <path d="M 680,0 L 740,160 L 670,240 L 790,380 L 720,490 L 780,620" stroke-width="6" />
    <path d="M 740,160 L 840,210 L 820,300" stroke-width="3" stroke="#38bdf8" />
  </g>
  <circle cx="740" cy="200" r="150" fill="#e0f2fe" opacity="0.25" filter="url(#realStormGlow)" />

  <!-- Mountain-High Ocean Waves in Living Surge Motion (Sóng Biển Xám Xịt Cao Bằng Mấy Nóc Nhà) -->
  <g style="animation: wave-surge 3.8s ease-in-out infinite alternate;">
    <path d="M 0,610 C 350,430 680,670 1020,470 C 1350,310 1680,580 1920,410 L 1920,1080 L 0,1080 Z" fill="#0c4a6e" opacity="0.85" />
    <path d="M 0,710 C 450,550 820,780 1200,590 C 1580,440 1780,670 1920,570 L 1920,1080 L 0,1080 Z" fill="url(#realAbyssWater)" />
  </g>

  <!-- White Sea Foam & Water Splashes Crashing -->
  <path d="M 0,720 Q 250,650 500,730 Q 800,630 1100,720 Q 1400,610 1700,710 Q 1850,670 1920,720" stroke="#f0f9ff" stroke-width="9" stroke-dasharray="25 15" fill="none" opacity="0.9" filter="url(#realStormGlow)" />
  <path d="M 0,830 Q 300,770 600,840 Q 950,750 1300,830 Q 1650,740 1920,820" stroke="#bae6fd" stroke-width="7" stroke-dasharray="20 10" fill="none" opacity="0.75" />

  <!-- Living Giant Bird Breaking Free & Soaring Up in Living Glide Motion (Chim Thần Nghiêng Cánh Vùng Lên) -->
  <g transform="translate(1380, 260)" filter="url(#realStormGlow)" style="animation: bird-glide 4s ease-in-out infinite alternate;">
    <path d="M -120,40 C -240,-120 -380,-160 -480,-100 C -440,0 -300,80 -160,80 Z" fill="#3b82f6" stroke="#60a5fa" stroke-width="3.5" />
    <path d="M 80,40 C 200,-100 340,-130 440,-80 C 400,10 280,80 140,80 Z" fill="#3b82f6" stroke="#60a5fa" stroke-width="3.5" />
    
    <ellipse cx="0" cy="30" rx="150" ry="75" fill="#0284c7" stroke="#38bdf8" stroke-width="3.5" />
    <circle cx="-140" cy="-30" r="38" fill="#06b6d4" stroke="#fde047" stroke-width="2.5" />
    <polygon points="-170,-30 -235,-20 -175,-10" fill="#f59e0b" />
    <path d="M 130,60 Q 270,120 330,250 Q 290,250 190,170 Z" fill="#f59e0b" stroke="#fde047" stroke-width="2.5" />
  </g>

  <!-- Greedy Older Brother & Colossal Gold Sack Plunging into Ocean Depth with Real Vortex Splash -->
  <g transform="translate(680, 680)" filter="url(#realStormGlow)">
    <!-- Giant Heavy Sack Dragging Him Down -->
    <ellipse cx="40" cy="120" rx="120" ry="100" fill="#78350f" stroke="#fde047" stroke-width="4.5" />
    
    <!-- Scattered Gold Coins Falling into Ocean Depths -->
    <g fill="#fde047">
      <circle cx="-20" cy="180" r="9" />
      <circle cx="80" cy="220" r="8" />
      <circle cx="20" cy="260" r="10" />
      <circle cx="120" cy="280" r="7" />
      <circle cx="-60" cy="240" r="9" />
    </g>

    <!-- Brother Sinking Upside Down (Người Anh Chới Với Chìm Sâu) -->
    <g transform="translate(-20, 20) rotate(140)" style="animation: human-breathe 2.5s ease-in-out infinite;">
      <circle cx="0" cy="-60" r="19" fill="#ea580c" stroke="#7c2d12" stroke-width="2" />
      <path d="M -20,-40 L 20,-40 L 25,40 L -25,40 Z" fill="#9a3412" stroke="#431407" stroke-width="3.5" />
      <line x1="-20" y1="-30" x2="-65" y2="-75" stroke="#ea580c" stroke-width="7" stroke-linecap="round" />
      <line x1="20" y1="-30" x2="65" y2="-75" stroke="#ea580c" stroke-width="7" stroke-linecap="round" />
    </g>

    <!-- Ocean Whirlpool Vortex Dragging Everything Down (Xoáy Nước Cuốn Chìm) -->
    <ellipse cx="0" cy="240" rx="190" ry="45" fill="none" stroke="#38bdf8" stroke-width="3.5" stroke-dasharray="16 8" />
    <ellipse cx="0" cy="300" rx="130" ry="28" fill="none" stroke="#0ea5e9" stroke-width="3" stroke-dasharray="12 6" />
  </g>

  <!-- Heavy Diagonal Rain Streaks -->
  <g stroke="#38bdf8" stroke-width="2" opacity="0.7">
    <line x1="200" y1="0" x2="100" y2="420" />
    <line x1="600" y1="50" x2="500" y2="470" />
    <line x1="1000" y1="0" x2="900" y2="520" />
    <line x1="1400" y1="20" x2="1300" y2="500" />
  </g>

  <!-- Vignette -->
  <rect width="1920" height="1080" fill="none" stroke="#000000" stroke-width="35" opacity="0.65" />
</svg>
