<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" height="100%">
  <defs>
    <!-- Cinematic Stormy Sky Gradient -->
    <radialGradient id="cinemaOceanSky" cx="50%" cy="30%" r="85%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="40%" stop-color="#0f172a" />
      <stop offset="75%" stop-color="#030712" />
      <stop offset="100%" stop-color="#000000" />
    </radialGradient>

    <!-- Dark Basalt Sea Rock -->
    <linearGradient id="basaltRock" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <!-- Raging Ocean Wave Layers -->
    <linearGradient id="cinemaWaveGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="35%" stop-color="#0369a1" />
      <stop offset="75%" stop-color="#082f49" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <!-- Divine Cyan Water Glow -->
    <radialGradient id="waterAuraGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#0284c7" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#082f49" stop-opacity="0" />
    </radialGradient>

    <filter id="cinemaRealGlow">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Sky Base -->
  <rect width="1920" height="1080" fill="url(#cinemaOceanSky)" />

  <!-- Distant Moody Horizon & Rolling Storm Clouds (Mây Giông Cuộn Trào) -->
  <g fill="#0f172a" opacity="0.85">
    <path d="M 0,250 C 350,120 700,280 1100,160 C 1500,60 1750,220 1920,150 L 1920,550 L 0,550 Z" style="animation: cloud-drift 12s ease-in-out infinite alternate;" />
  </g>

  <!-- Distant Lightning Strike Over Ocean -->
  <g stroke="#e0f2fe" stroke-width="3.5" fill="none" filter="url(#cinemaRealGlow)">
    <path d="M 450,0 L 480,180 L 420,260 L 520,400 L 460,510 L 500,620" />
    <path d="M 480,180 L 560,230 L 540,310" stroke-width="2" stroke="#38bdf8" />
  </g>
  <circle cx="480" cy="200" r="140" fill="#38bdf8" opacity="0.2" filter="url(#cinemaRealGlow)" />

  <!-- Colossal Crashing Waves in Midground (Sóng Thần Cuộn Trào Giữa Biển) -->
  <g style="animation: wave-surge 4s ease-in-out infinite alternate;">
    <path d="M 0,550 C 400,380 750,620 1150,440 C 1500,280 1780,560 1920,420 L 1920,1080 L 0,1080 Z" fill="url(#cinemaWaveGrad)" />
    <!-- White Water Spray & Sea Foam -->
    <path d="M 0,560 Q 250,490 500,570 Q 800,470 1150,560 Q 1500,450 1920,550" stroke="#f8fafc" stroke-width="8" stroke-dasharray="25 15" fill="none" opacity="0.85" filter="url(#cinemaRealGlow)" />
  </g>

  <!-- Giant Basalt Cliff Peak in Foreground (Mỏm Đá Đen Ngăn Sóng Tương Tự sample.mp4) -->
  <g transform="translate(960, 780)">
    <polygon points="-420,300 -300,-80 -120,-220 100,-260 320,-90 480,300" fill="url(#basaltRock)" stroke="#475569" stroke-width="4" />
    <!-- Jagged Stone Crags Details -->
    <path d="M -120,-220 L -60,80 L 40,240" stroke="#1e293b" stroke-width="5" />
    <path d="M 100,-260 L 160,50 L 220,260" stroke="#1e293b" stroke-width="5" />
  </g>

  <!-- Photorealistic Live-Action Water God Thuy Tinh (Tương Tự Sơn Tinh trong sample.mp4) -->
  <g transform="translate(960, 520)" style="animation: human-breathe 4s ease-in-out infinite;">
    <!-- Divine Ocean Aura -->
    <circle cx="0" cy="-60" r="140" fill="url(#waterAuraGlow)" />

    <!-- Athletic Defined Torso with Water Sheen (Cơ Bắp Vạm Vỡ Ướt Nước Biển) -->
    <ellipse cx="0" cy="-65" rx="24" ry="28" fill="#0284c7" stroke="#38bdf8" stroke-width="2" />
    <path d="M -50,-35 L -35,65 L 35,65 L 50,-35 Z" fill="#0369a1" stroke="#075985" stroke-width="2.5" />
    
    <!-- Chest & Abdominal Muscle Shadows (Cơ Ngực & Cơ Bụng 6 Múi) -->
    <path d="M -22,-20 Q 0,-10 22,-20" stroke="#075985" stroke-width="3" fill="none" />
    <line x1="0" y1="-20" x2="0" y2="40" stroke="#075985" stroke-width="2.5" />
    <line x1="-18" y1="0" x2="18" y2="0" stroke="#075985" stroke-width="2" />
    <line x1="-16" y1="20" x2="16" y2="20" stroke="#075985" stroke-width="2" />

    <!-- Traditional Ancient Van Lang Sea-Robe Sash Across Shoulder (Tấm Vải Vắt Chéo) -->
    <path d="M -45,-30 L 25,65 L 38,65 L -30,-35 Z" fill="#0c4a6e" stroke="#38bdf8" stroke-width="2" />

    <!-- Long Wet Dark Hair Blowing in Storm Wind (Tóc Dài Bay Trong Gió Biển Tương Tự sample.mp4) -->
    <path d="M 15,-85 C 45,-95 85,-110 130,-90 C 120,-70 80,-65 30,-60 Z" fill="#020617" stroke="#38bdf8" stroke-width="1.5" />
    <path d="M 10,-70 C 50,-80 90,-85 140,-65 C 120,-45 70,-45 25,-45 Z" fill="#020617" />

    <!-- Heroic Intense Facial Features & Shark Tooth Necklace -->
    <ellipse cx="0" cy="-65" rx="20" ry="24" fill="#0284c7" />
    <circle cx="-7" cy="-68" r="3" fill="#ffffff" />
    <circle cx="7" cy="-68" r="3" fill="#ffffff" />
    <circle cx="-7" cy="-68" r="1.5" fill="#000000" />
    <circle cx="7" cy="-68" r="1.5" fill="#000000" />
    <!-- Shark Tooth / Shell Necklace -->
    <path d="M -16,-45 Q 0,-30 16,-45" stroke="#f8fafc" stroke-width="3" fill="none" />

    <!-- Ancient Bronze Trident in Right Hand (Đinh Ba Đồng Thau) -->
    <g transform="translate(65, -30)">
      <line x1="0" y1="-140" x2="-15" y2="120" stroke="#eab308" stroke-width="6" />
      <!-- 3 Prongs of Trident -->
      <polygon points="0,-160 -15,-130 15,-130" fill="#fef08a" stroke="#ca8a04" stroke-width="2" filter="url(#cinemaRealGlow)" />
      <polygon points="-22,-145 -35,-120 -10,-120" fill="#fef08a" stroke="#ca8a04" stroke-width="2" filter="url(#cinemaRealGlow)" />
      <polygon points="22,-145 10,-120 35,-120" fill="#fef08a" stroke="#ca8a04" stroke-width="2" filter="url(#cinemaRealGlow)" />
    </g>

    <!-- Traditional Van Lang Loincloth with Water Patterns -->
    <rect x="-35" y="55" width="70" height="15" fill="#0c4a6e" stroke="#38bdf8" stroke-width="2" />
    <polygon points="-25,70 25,70 15,145 -15,145" fill="#034166" stroke="#38bdf8" stroke-width="2" />
  </g>

  <!-- Flowing Sea Water Dragon Tendrils Circling Rock (Rồng Nước Biển Sâu) -->
  <g fill="none" stroke="#38bdf8" stroke-width="12" stroke-linecap="round" opacity="0.8" filter="url(#cinemaRealGlow)">
    <path d="M 680,680 Q 760,540 840,620 Q 920,700 960,650" />
    <path d="M 1240,660 Q 1160,520 1080,600 Q 1000,680 960,640" />
  </g>

  <!-- Atmospheric Sea Spray & Rain Streaks -->
  <g stroke="#e0f2fe" stroke-width="1.5" opacity="0.6">
    <line x1="200" y1="0" x2="100" y2="350" />
    <line x1="600" y1="20" x2="500" y2="380" />
    <line x1="1000" y1="0" x2="900" y2="420" />
    <line x1="1400" y1="10" x2="1300" y2="390" />
    <line x1="1750" y1="0" x2="1650" y2="360" />
  </g>

  <!-- Cinematic Vignette -->
  <rect width="1920" height="1080" fill="none" stroke="#000000" stroke-width="35" opacity="0.55" />
</svg>
